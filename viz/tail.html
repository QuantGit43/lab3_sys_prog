;
</script>
<script>
const groups = {
  decl: ["Program", "Function", "Params", "Param", "Decl", "Var"],
  stmt: ["Block", "If", "While", "For", "Return", "Break", "Continue", "ExprStmt", "Empty"],
  expr: ["Binary", "Unary", "Assign", "IncDec", "Call", "Index"],
  leaf: ["Num", "Str", "Id"]
};
const color = t => `var(--${Object.keys(groups).find(g => groups[g].includes(t)) || "none"})`;

document.getElementById("title").textContent = "AST: " + DATA.file;
const src = document.getElementById("src");
const lines = DATA.source.split("\n").map((s, i) => {
  const d = document.createElement("div");
  const n = document.createElement("span");
  n.textContent = i + 1;
  d.append(n, s);
  src.append(d);
  return d;
});
const mark = l => lines.forEach((d, i) => d.classList.toggle("on", i + 1 === l));

const svg = d3.select("#tree");
const g = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.1, 3]).on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom).on("dblclick.zoom", null);
const linkG = g.append("g"), nodeG = g.append("g");

const root = d3.hierarchy(DATA.ast);
root.descendants().forEach((d, i) => { d.id = i; d._children = d.children; });
const layout = d3.tree().nodeSize([22, 190]);
const diag = d3.linkHorizontal().x(d => d.y).y(d => d.x);

function update(source) {
  layout(root);
  const nodes = root.descendants(), links = root.links();
  const t = svg.transition().duration(300);

  const node = nodeG.selectAll("g.node").data(nodes, d => d.id);
  const enter = node.enter().append("g").attr("class", "node")
    .attr("transform", `translate(${source.y0 ?? source.y},${source.x0 ?? source.x})`)
    .style("cursor", d => d._children ? "pointer" : "default")
    .on("click", (e, d) => { if (!d._children) return; d.children = d.children ? null : d._children; update(d); })
    .on("mouseenter", (e, d) => mark(d.data.line))
    .on("mouseleave", () => mark(0));
  enter.append("circle").attr("r", 6).attr("stroke", d => color(d.data.type));
  enter.append("text").attr("dy", "0.32em").attr("x", 10).text(d => d.data.name);
  enter.append("title").text(d => `${d.data.type}, рядок ${d.data.line}`);
  node.merge(enter).transition(t)
    .attr("transform", d => `translate(${d.y},${d.x})`)
    .select("circle").attr("fill", d => d._children && !d.children ? color(d.data.type) : "var(--panel)");
  node.exit().transition(t).attr("transform", `translate(${source.y},${source.x})`).remove();

  const link = linkG.selectAll("path.link").data(links, d => d.target.id);
  const o = { x: source.x0 ?? source.x, y: source.y0 ?? source.y };
  link.enter().append("path").attr("class", "link").attr("d", diag({ source: o, target: o }))
    .merge(link).transition(t).attr("d", diag);
  link.exit().transition(t).attr("d", diag({ source, target: source })).remove();

  root.each(d => { d.x0 = d.x; d.y0 = d.y; });
}

function fit() {
  const w = svg.node().clientWidth, h = svg.node().clientHeight, ns = root.descendants();
  if (!w || !h) return;
  const x0 = d3.min(ns, d => d.y) - 20, x1 = d3.max(ns, d => d.y) + 200;
  const y0 = d3.min(ns, d => d.x) - 20, y1 = d3.max(ns, d => d.x) + 20;
  const k = Math.max(0.5, Math.min(1.2, Math.min(w / (x1 - x0), h / (y1 - y0))));
  const tx = k * (x1 - x0) > w ? 16 - k * x0 : (w - k * (x0 + x1)) / 2;
  const ty = k * (y1 - y0) > h ? h / 2 : (h - k * (y0 + y1)) / 2;
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
}

function setDepth(max) {
  root.each(d => { d.children = d._children && d.depth < max ? d._children : null; });
  update(root);
  fit();
}

document.getElementById("expand").onclick = () => setDepth(Infinity);
document.getElementById("collapse").onclick = () => setDepth(2);
document.getElementById("fit").onclick = fit;
window.addEventListener("resize", fit);
setDepth(Infinity);
</script>
</body>
</html>
